<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentilytics | Odyssey Sentiment Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <canvas id="particle-canvas"></canvas>
    <div class="container">
        <header>
            <h1>Sentilytics</h1>
            <p>High-performance feedback analysis for 10,000+ entries</p>
        </header>

        <main>
            <section class="upload-section">
                <div class="card-light show">
                    <h3>Data Ingestion</h3>
                    <input type="file" id="fileInput" accept=".csv, .json">
                    <div class="divider">OR</div>
                    <textarea id="rawText" placeholder="Paste feedback here (one comment per line)..."></textarea>
                    <button id="analyzeBtn">Run Analysis</button>
                    <div id="loader" class="hidden">
                        <div class="spinner"></div>
                        <span>Processing Dataset...</span>
                    </div>
                </div>
            </section>

            <section id="resultsSection" class="hidden">
                <div class="stats-row">
                    <div class="card">
                        <h3>Processed</h3>
                        <p id="commentCount" class="stat-number">0</p>
                        <span>Feedback Entries</span>
                    </div>
                    <div class="card">
                        <h3>Sentiment Distribution</h3>
                        <div style="height: 200px; position: relative;">
                            <canvas id="sentimentChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h3>AI Feedback Summary</h3>
                    <p id="summaryText" class="summary-box"></p>
                </div>

                <div class="grid-row">
                    <div class="card">
                        <h3>Top Keywords</h3>
                        <ul id="keywordList"></ul>
                    </div>
                    <div class="card">
                        <h3>Word Cloud</h3>
                        <div class="image-container">
                            <img id="wordcloudImg" src="" alt="Word Cloud">
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
